spring.application.name=calendar
# Порт задаёт хостинг (Render, Docker) переменной PORT; локально по умолчанию 8080
server.port=${PORT:8080}
# Часовой пояс владельца: в нём заданы границы дня 9:00–18:00 и окно записи
calendar.owner-timezone=Europe/Moscow
# Сохранять offset из запроса (пояс владельца), а не приводить даты к UTC контекста Jackson
spring.jackson.datatype.datetime.adjust-dates-to-context-time-zone=false
